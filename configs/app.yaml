# ====================================================
# AI Video Shorts Automation - Application Config
# ====================================================

app:
  name: "AI Video Shorts Automation"
  version: "1.0.0"
  temp_dir: "temp"
  log_dir: "logs"
  log_level: "INFO"

input:
  base_dir: "input"

output:
  base_dir: "output"
  format: "mp4"
  naming_pattern: "{video_name}_part{number:03d}"

video:
  output_width: 1080
  output_height: 1920
  fps: 30
  codec: "h264"
  audio_codec: "aac"
  audio_bitrate: "256k"
  video_bitrate: "16M"
  preset: "slow"
  crf: 16

shorts:
  min_duration: 15
  max_duration: 90
  target_duration: 60
  silence_threshold: -40
  silence_min_duration: 2.0
  overlap_seconds: 0.5

# Tutorial-style shorts (techie_krishna_kayaking, tkk_live_shorts):
# 9:16 source (slides on top, face-cam on bottom). Overlays are placed
# relative to the frame so nothing sits over the speaker's face.
# All px values assume a 1080-wide frame and scale for other widths.
shorts_overlay:
  segment_seconds: 27.0        # each output = 27s of content + outro
  min_tail_seconds: 2.0        # keep a final short only if it has >= this much content
  outro_path: "assets/social/tkk-shorts-outro1.mp4"
  safe_margin: 20              # left/top inset for the stacked overlays (px)
  overlay_padding: 15          # vertical gap between stacked overlays (px)
  boundary_fraction: 0.65      # slide/face divider position (fraction of height)
  social_icons:
    image: "assets/social/tkk_socials.png"
    width_frac: 0.34
  topmate:
    image: "assets/social/tkk-topamte-color.png"
    width_frac: 0.42
    margin_top: 15
  website:
    image: "assets/social/tkk-website.png"
    width_frac: 0.52

transcription:
  model: "base"
  language: "en"
  word_timestamps: true
  device: "auto"

captions:
  enabled: true
  style: "modern"
  font: "assets/fonts/Montserrat-Bold.ttf"
  font_size: 48
  font_color: "#FFFFFF"
  outline_color: "#000000"
  outline_width: 3
  position: "center"
  max_words_per_line: 6

rendering:
  gpu_enabled: true
  gpu_encoder: "h264_nvenc"
  cpu_encoder: "libx264"
  threads: 0
  hwaccel: "cuda"

processing:
  batch_size: 5
  max_workers: 2
  retry_attempts: 3
  retry_delay: 5

watcher:
  enabled: false
  poll_interval: 10
  recursive: true

assets:
  social_dir: "assets/social"
  fonts_dir: "assets/fonts"
  overlays_dir: "assets/overlays"

branding:
  overlay_width_frac: 0.22
  overlay_opacity: 0.90
  longform_margin: 30
  shorts_bottom_margin: 24

# ====================================================
# Telegram status notifications
# ====================================================
# The tool sends a concise hourly progress update (on the hour, e.g. 1:00,
# 2:00 ...) via Telegram while a batch / batch-all run is in progress.
#
# >>> UPDATE YOUR TWO VALUES BELOW <<<
#   telegram_bot_token : token from @BotFather
#   telegram_chat_id   : your chat/user id (from @userinfobot)
#
# You may also set them as environment variables instead (these override the
# values below): TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
notifications:
  enabled: true
  telegram_bot_token: "8798151262:AAFsRUn_tfaQZA1ONWQmBp9WdfKpExro1aU"   # <-- paste your bot token here
  telegram_chat_id: "1160739943"     # <-- paste your chat id here
trip:
  photo_duration: 4.0
  ken_burns_enabled: true
  blur_background_enabled: true
  instagram_music_volume: 0.2
  trending_audio_count: 100
  cleanup_after_upload: true
  output_width: 2560
  output_height: 1440
  instagram_trending_manifest: "configs/trending_audio_instagram.json"
  youtube_trending_manifest: "configs/trending_audio_youtube.json"
  trending_provider:
    enabled: false
    provider_type: "filesystem"
    source_dir: "assets/audio/trending"
    source_manifest_url: ""
    auth_env_var: ""
    download_dir: "assets/audio/ingested"
    request_timeout_seconds: 30
    pixabay_api_key_env: "PIXABAY_API_KEY"
    pixabay_category: "music"
    pixabay_order: "popular"
